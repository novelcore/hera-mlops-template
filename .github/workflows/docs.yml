# Builds the client guide (MkDocs) and publishes it to GitHub Pages.
#
# This is documentation only. It is separate from the platform's in-cluster
# CI that builds and releases the pipeline. It runs when files under docs/ or
# the mkdocs.yml change on main.
#
# One time setup by a repo admin: in the repository Settings, open Pages, and
# set the Source to "GitHub Actions". After that this workflow publishes the
# site on every change.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
